[package]
name = "origincloud-mcp-generator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Generates the MCP tools of every service of the API from its definitions."

[dependencies]
anyhow.workspace = true
base64.workspace = true
heck = "0.5"
prettyplease = "0.2"
prost = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
protox = "0.9"
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha3 = "0.10"
toml = "0.8"
syn = { version = "2", features = ["full", "parsing", "printing"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
# Directories for the tests' definitions.
tempfile = "3.16"
